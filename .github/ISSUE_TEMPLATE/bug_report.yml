name: Сообщить о проблеме
description: Воспроизводимая ошибка без личных данных
title: "[Ошибка] "
body:
  - type: textarea
    id: task
    attributes:
      label: Задача и обезличенные исходные данные
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Ожидали и получили
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Версия Vovan OS и среда
      placeholder: "4.3.0, ChatGPT или Codex, Windows или Linux"
  - type: checkboxes
    id: privacy
    attributes:
      label: Перед отправкой
      options:
        - label: Я удалил ключи, пароли и личные данные
          required: true
