name: Бесплатные ролики Google Vids
on:
  push:
    branches: [codex/grezorg-free-vids-reel-20261106]
    paths: [.github/workflows/grezorg-free-vids-reel.yml]
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install edge-tts==7.3.1
      - run: |
          mkdir -p voice
          python - <<'PY'
          import asyncio,json,pathlib
          import edge_tts
          text="Бесплатные ролики от Гугл. В Гугл Видс заявлены три генерации в месяц, до пятнадцати секунд каждая. Это лимит из анонса от пятого ноября. Открой сайт с компьютера и войди в Гугл-аккаунт. Адрес на экране. Доступ зависит от аккаунта и региона. Здесь официальные примеры модели. Сохрани, чтобы попробовать."
          async def main():
              words=[]
              c=edge_tts.Communicate(text,"ru-RU-DmitryNeural",rate="+0%",boundary="WordBoundary")
              with open("voice/narration.mp3","wb") as f:
                  async for x in c.stream():
                      if x["type"]=="audio":f.write(x["data"])
                      elif x["type"]=="WordBoundary":words.append(x)
              pathlib.Path("voice/words.json").write_text(json.dumps(words,ensure_ascii=False,indent=2),encoding="utf-8")
              pathlib.Path("voice/script.txt").write_text(text,encoding="utf-8")
          asyncio.run(asyncio.wait_for(main(),timeout=80))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grezorg-free-vids-voice
          path: voice/
          retention-days: 7
